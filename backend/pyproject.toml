[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4==4.13.4",
    "celery==5.5.3",
    "django==5.2",
    "django-celery-beat==2.8.1",
    "django-cors-headers==4.7.0",
    "django-environ==0.12.0",
    "django-filter==25.1",
    "djangorestframework==3.16.0",
    "djangorestframework-simplejwt==5.5.0",
    "drf-standardized-errors==0.14.1",
    "fake-useragent==2.2.0",
    "flower==2.0.1",
    "gunicorn==25.1.0",
    "openai==2.13.0",
    "pillow==12.0.0",
    "psycopg[binary,pool]==3.2.9",
    "pydantic==2.12.3",
    "python-json-logger==4.2.0",
    "redis==6.1.0",
    "requests==2.32.4",
    "whitenoise==6.11.0",
]

[dependency-groups]
dev = [
    "complexipy==8.0.1",
    "deptry==0.25.1",
    "django-extensions==4.1",
    "django-silk==5.4.0",
    "django-stubs==5.2.0",
    "djangorestframework-stubs==3.16.0",
    "mypy==1.15.0",
    "pyscn==1.32.2",
    "ruff==0.15.22",
    "types-requests==2.32.4.20250611",
    "werkzeug==3.1.3",
]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes (what flake8 ran)
    "B",            # bugbear
    "C4",           # comprehensions
    "LOG", "G",     # logging; G004 bans f-strings in log calls
    "I",            # import sorting
    "UP",           # pyupgrade
    "DJ",           # django
    "S",            # bandit
    "SIM",          # simplify
    "DTZ",          # naive datetimes
    "T20",          # print
    "RUF",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Cyrillic text is intended
    "RUF012",                      # Django/DRF class attributes are lists by convention
]

[tool.ruff.lint.per-file-ignores]
"src/core/settings/*" = ["F403", "F405"]  # settings layer each other with star imports
# Backlog: existing violations. Fix a file, then delete its line. Don't add new lines.
"src/core/settings/development.py" = ["RUF005"]
"src/integrations/openai.py" = ["UP047"]
"src/mylists/admin.py" = ["I001"]
"src/mylists/models.py" = ["I001"]
"src/mylists/services/mylistitem.py" = ["I001"]
"src/mylists/tests.py" = ["F401"]
"src/mylists/views.py" = ["I001", "RUF100"]
"src/products/admin.py" = ["I001"]
"src/products/ai/smart_search.py" = ["I001"]
"src/products/ai/supplement_enrichment.py" = ["I001"]
"src/products/models.py" = ["I001", "RUF100"]
"src/products/services/brand.py" = ["I001"]
"src/products/services/product.py" = ["I001"]
"src/products/services/productgroup.py" = ["I001"]
"src/products/tests.py" = ["F401"]
"src/products/validators.py" = ["B904"]
"src/products/views.py" = ["I001"]
"src/scrapers/annifarm/__init__.py" = ["RUF022"]
"src/scrapers/annifarm/validators.py" = ["UP035"]
"src/scrapers/apteka24/__init__.py" = ["RUF022"]
"src/scrapers/apteka24/validators.py" = ["UP035"]
"src/scrapers/shared/validators.py" = ["I001", "UP035"]
"src/scrapers/tasks.py" = ["I001"]
"src/scrapers/tests.py" = ["F401"]
"src/scrapers/vitamini/__init__.py" = ["RUF022"]
"src/scrapers/vitamini/validators.py" = ["UP035"]
"src/scrapers/zegin/__init__.py" = ["RUF022"]
"src/scrapers/zegin/url.py" = ["RUF100"]
"src/scrapers/zegin/validators.py" = ["UP035"]
"src/users/admin.py" = ["F401"]
"src/users/models.py" = ["F401"]
"src/users/tests.py" = ["F401"]
"src/users/views.py" = ["I001"]

[tool.ruff.format]
# Backlog: files not yet formatted. Run `ruff format <file>`, then delete its line.
exclude = [
    "src/common/apps.py",
    "src/mylists/apps.py",
    "src/mylists/models.py",
    "src/mylists/serializers.py",
    "src/mylists/views.py",
    "src/products/admin.py",
    "src/products/ai/supplement_enrichment.py",
    "src/products/apps.py",
    "src/products/filters.py",
    "src/products/models.py",
    "src/products/serializers.py",
    "src/products/services/category.py",
    "src/products/services/product.py",
    "src/products/services/productcategory.py",
    "src/products/services/productgroup.py",
    "src/products/services/productgroupcategory.py",
    "src/products/views.py",
    "src/scrapers/annifarm/selectors.py",
    "src/scrapers/annifarm/validators.py",
    "src/scrapers/apps.py",
    "src/scrapers/apteka24/catalog.py",
    "src/scrapers/apteka24/selectors.py",
    "src/scrapers/apteka24/validators.py",
    "src/scrapers/shared/imports.py",
    "src/scrapers/shared/normalization.py",
    "src/scrapers/shared/validators.py",
    "src/scrapers/tasks.py",
    "src/scrapers/vitamini/selectors.py",
    "src/scrapers/vitamini/validators.py",
    "src/scrapers/zegin/validators.py",
    "src/users/apps.py",
]

[tool.deptry]
known_first_party = ["common", "core", "integrations", "mylists", "products", "scrapers", "users"]

[tool.deptry.per_rule_ignores]
# Loaded by name (settings strings, CLI, DB engine, broker), never imported.
DEP002 = [
    "django-celery-beat",
    "django-cors-headers",
    "drf-standardized-errors",
    "flower",
    "gunicorn",
    "pillow",
    "psycopg",
    "python-json-logger",
    "redis",
    "whitenoise",
]
# Backlog: scrapers validators import typing_extensions; switch them to typing.
DEP003 = ["typing_extensions"]

[tool.pyscn.complexity]
# Backlog: scrapers/tasks.py scrape_pharmacy_page is 110 lines. Lower to 100 once it is split.
function_sloc_critical_threshold = 110

[tool.complexipy]
# Backlog: existing functions over the limit carry `# complexipy: ignore`. Simplify, then remove it.
paths = ["src"]
exclude = ["**/migrations/**"]
max-complexity-allowed = 15
