[mypy]

mypy_path = src/

plugins =
    mypy_django_plugin.main,
    mypy_drf_plugin.main

exclude = ^core/|migrations/

[mypy.plugins.django-stubs]
django_settings_module = "core.settings.django"

# Ignore errors in all urls.py modules
[mypy-*.urls]
ignore_errors = True

# Ignore errors in all models.py modules
[mypy-*.models]
ignore_errors = True

# Ignore errors in all test modules
[mypy-*.tests.*]
ignore_errors = True

# Ignore errors in all settings modules
[mypy-core.settings.*]
ignore_errors = true

[mypy-environ.*]
ignore_missing_imports = True

[mypy-celery.*]
ignore_missing_imports = True

[mypy-django_filters.*]
ignore_missing_imports = True

# Backlog: existing errors, frozen per module. Fix a module, then delete its section.
# Don't add new sections.
[mypy-mylists.services.mylist]
disable_error_code = valid-type

[mypy-mylists.services.mylistitem]
disable_error_code = valid-type

[mypy-mylists.views]
disable_error_code = misc

[mypy-products.admin]
disable_error_code = return, return-value

[mypy-products.services.brand]
disable_error_code = return-value, union-attr

[mypy-products.services.product]
disable_error_code = name-defined, union-attr

[mypy-products.services.productgroup]
disable_error_code = arg-type

[mypy-products.validators]
disable_error_code = arg-type

[mypy-products.views]
disable_error_code = misc

[mypy-scrapers.annifarm.catalog]
disable_error_code = arg-type, dict-item

[mypy-scrapers.apteka24.catalog]
disable_error_code = arg-type, dict-item

[mypy-scrapers.vitamini.catalog]
disable_error_code = arg-type, dict-item

[mypy-scrapers.zegin.catalog]
disable_error_code = arg-type, dict-item, union-attr

[mypy-scrapers.annifarm.normalization]
disable_error_code = return-value

[mypy-scrapers.apteka24.normalization]
disable_error_code = return-value

[mypy-scrapers.shared.normalization]
disable_error_code = return-value

[mypy-scrapers.vitamini.normalization]
disable_error_code = return-value

[mypy-scrapers.zegin.normalization]
disable_error_code = return-value

[mypy-users.views]
disable_error_code = misc
