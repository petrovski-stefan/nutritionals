events {}

http {

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Cloudflare proxies the site, so $remote_addr is a Cloudflare IP and the visitor's IP
  # is in CF-Connecting-IP. rt is the total time, urt the time Django took, rid the
  # request id Django also logs
  log_format main '$remote_addr client=$http_cf_connecting_ip [$time_iso8601] '
                  '"$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" '
                  'rt=$request_time urt=$upstream_response_time rid=$request_id';
  access_log /var/log/nginx/access.log main;

  server {
    listen 443 ssl;
    server_name nutritionals-ceni.com;

    ssl_certificate /etc/letsencrypt/live/nutritionals-ceni.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nutritionals-ceni.com/privkey.pem;

    location /api/ {
      proxy_pass http://nutritionals_web:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-ID $request_id;
    }

    
    location ^~ /static/ {
      alias /staticfiles/;
    }

    location /admin/ {
      proxy_pass http://nutritionals_web:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-ID $request_id;
    }

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri /index.html;
    }
  }
}